<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Tasks</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b5bd6'/%3E%3Cstop offset='1' stop-color='%239b6cf5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    // Тёмная тема пока скрыта: всегда светлая (код тёмной оставлен в CSS)
    document.documentElement.dataset.theme = 'light';
  </script>
  <style>
    /* Первый экран до загрузки стилей и скриптов: сайдбар и серые блоки, как на остальных страницах */
    html, body { margin: 0; background: #f2f3f6; }
    #shell { display: grid; grid-template-columns: 256px minmax(0, 1fr); gap: 6px; height: 100vh; box-sizing: border-box; padding: 16px 0 16px 6px; }
    #sidebar { background: #191d36; border-radius: 34px; }
    .nav-scrim { display: none; }
    .first-load { padding: 88px 16px 0 24px; }
    .first-load .skel { display: flex; flex-direction: column; gap: 8px; }
    .first-load .skel i { display: block; height: 44px; border-radius: 12px; background: linear-gradient(100deg, #eceef2 30%, #f7f8fa 50%, #eceef2 70%) 0 0 / 300% 100%; animation: shim 1.4s ease-in-out infinite; }
    #sidebar:empty { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes shim { from { background-position: 100% 0; } to { background-position: 0 0; } }
    @keyframes pulse { 50% { opacity: .82; } }
    @media (prefers-reduced-motion: reduce) { .first-load .skel i, #sidebar:empty { animation: none; } }
    .first-load .skel .skel-t { height: 16px; width: 200px; border-radius: 8px; }
    .first-load .skel .skel-s { width: 70%; }
    @media (max-width: 900px) { #shell { display: block; padding: 0; } #sidebar { display: none; } .first-load { padding: 72px 16px 0; } }
  </style>
</head>
<body>
  <div id="shell">
    <aside id="sidebar"></aside>
    <div class="nav-scrim"></div>
    <div id="main"><div class="first-load"><div class="skel" role="status" aria-label="Загрузка"><i class="skel-t"></i><i></i><i></i><i class="skel-s"></i></div></div></div>
  </div>
  <div id="panel-root"></div>
  <div id="modal-root"></div>
  <div id="palette-root"></div>
  <div id="toast-root"></div>
  <div id="saving" hidden><span class="spinner"></span>Сохранение…</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
